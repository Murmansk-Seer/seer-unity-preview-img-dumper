name: Sync Preview Images

on:
  schedule:
    # GitHub cron can be delayed. Retry throughout Friday's official update
    # window (11:00-14:40 Asia/Shanghai) instead of relying on one noon run.
    - cron: "0,20,40 3-6 * * 5"
    - cron: "0 7 * * 5"
  workflow_dispatch:

concurrency:
  group: preview-image-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  sync-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install

      - name: Run image sync
        run: npm start

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            export TZ='Asia/Shanghai'
            git commit -m "🤖 Auto sync preview images - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
