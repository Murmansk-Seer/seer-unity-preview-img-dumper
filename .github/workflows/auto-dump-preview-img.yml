name: Sync Preview Images

on:
  schedule:
    # Official assets can change on any day; GitHub cron may run late.
    - cron: "0,30 * * * *"
    # Re-evaluate shortly after a midnight display-window boundary.
    - cron: "5 16 * * *"
  workflow_dispatch:

concurrency:
  group: preview-image-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  sync-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install

      - name: Test preview selection
        run: python -m unittest discover -s tests -v

      - name: Run image sync
        run: npm start

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            export TZ='Asia/Shanghai'
            git commit -m "🤖 Auto sync preview images - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
